apiVersion: apps/v1
kind: Deployment
metadata:
  name: kisaanai-backend
  labels:
    app: kisaanai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kisaanai-backend
  template:
    metadata:
      labels:
        app: kisaanai-backend
    spec:
      containers:
      - name: backend
        image: docker.io/nuctan/kisaanai-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          value: "mongodb://kisaanai-mongo-service:27017/kisaanai"
        - name: SENTINELHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kisaanai-secrets
              key: SENTINELHUB_CLIENT_ID
        - name: SENTINELHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kisaanai-secrets
              key: SENTINELHUB_CLIENT_SECRET
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: kisaanai-secrets
              key: GROQ_API_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kisaanai-secrets
              key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: kisaanai-backend-service
spec:
  type: ClusterIP
  selector:
    app: kisaanai-backend
  ports:
  - port: 8000
    targetPort: 8000
