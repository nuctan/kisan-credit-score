apiVersion: apps/v1
kind: Deployment
metadata:
  name: kisaanai-mongo
  labels:
    app: kisaanai-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kisaanai-mongo
  template:
    metadata:
      labels:
        app: kisaanai-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-persistent-storage
          mountPath: /data/db
      volumes:
      - name: mongo-persistent-storage
        persistentVolumeClaim:
          claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kisaanai-mongo-service
spec:
  type: ClusterIP
  selector:
    app: kisaanai-mongo
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
