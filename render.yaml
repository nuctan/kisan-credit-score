services:
  - type: web
    name: kisanai-backend
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: SENTINELHUB_CLIENT_ID
        sync: false
      - key: SENTINELHUB_CLIENT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: krishiai_secret_key_super_secure_2024
